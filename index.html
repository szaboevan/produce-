<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111711"><title>ATOMIC | Produce Audits</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#edf5e8;background:#101510}*{box-sizing:border-box}body{margin:0}header{padding:22px 18px;background:#182119;border-bottom:1px solid #344235}header strong{font-size:30px;letter-spacing:4px;color:#b5f55c}header small{display:block;letter-spacing:2px;font-size:10px;color:#aab8a2}main{max-width:800px;margin:auto;padding:20px 16px 80px}.card{background:#1b251d;border:1px solid #344435;border-radius:17px;padding:18px;margin:14px 0}h1{font-size:24px;margin:0 0 10px}h2{font-size:17px;margin:0 0 12px}p,.muted{color:#aab9a7}label{display:block;font-size:12px;letter-spacing:.5px;color:#b4c4b0;margin:14px 0 6px}input,textarea,select{width:100%;background:#111811;color:white;border:1px solid #455648;border-radius:10px;padding:13px;font:inherit}textarea{min-height:95px;resize:vertical}button{border:0;border-radius:10px;padding:13px 16px;background:#b5f55c;color:#142011;font-weight:750;cursor:pointer}button.secondary{background:#334335;color:#eaf3e5}button.danger{background:#61312e;color:#fff}button:disabled{opacity:.5}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.item{padding:13px 0;border-bottom:1px solid #354336;display:flex;justify-content:space-between;gap:10px;align-items:center}.item:last-child{border:0}.pill{background:#334b29;color:#c6ff84;padding:5px 9px;border-radius:99px;font-size:11px}.photos{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.photo{position:relative}.photo img{width:92px;height:92px;object-fit:cover;border-radius:9px}.photo button{position:absolute;right:0;top:0;padding:4px 8px;background:#522}.back{margin-bottom:16px}.hide{display:none!important}@media print{header,.noprint,button,input[type=file]{display:none!important}body{background:white;color:#111}main{max-width:none}.card{background:white;color:#111;border:1px solid #bbb;break-inside:avoid}p,.muted,label{color:#444}textarea,input{color:#111;background:white;border:0;padding:0}.photo img{width:150px;height:150px}h1{color:#111}}
</style></head><body><header><strong>ATOMIC</strong><small>PRODUCT MONITORING · RETAIL MERCHANDISING</small></header><main id="app"></main>
<script>
const CATS=["Fruit Wall","Vegetable Wall","Promotional Display — Lead","Promotional Display — Hot Buys","Outside Displays","Dry Table","Tomato Table","Banana Display"];
const DB="atomic-audit-v1";let state={stores:[],audits:[]},page="home",active=null;
try{const s=localStorage.getItem(DB);if(s)state=JSON.parse(s)}catch(e){alert("Saved data could not be read. Export a backup before proceeding.")}
const el=document.getElementById("app");const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){try{localStorage.setItem(DB,JSON.stringify(state));return true}catch(e){alert("Device storage is full. Export a backup; photos may be too large.");return false}}
function uid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())}
function storeName(id){return state.stores.find(s=>s.id===id)?.name||"Unknown store"}
function render(){if(page==="home")home();else if(page==="edit")edit();else report()}
function home(){el.innerHTML='<h1>Store visits</h1><p>Capture conditions, notes and photos during each visit.</p><div class="card"><h2>Add retail location</h2><label>Store name</label><input id="storeName" placeholder="e.g. Main Street Market"><label>Location / address (optional)</label><input id="storeAddress" placeholder="City or street address"><button style="margin-top:14px" id="addStore">Add store</button></div><div class="card"><h2>Start an audit</h2><label>Retail location</label><select id="storeSelect"><option value="">Select a store</option>'+state.stores.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.name)+'</option>').join("")+'</select><label>Visit date</label><input type="date" id="visitDate" value="'+new Date().toLocaleDateString("en-CA")+'"><label>Auditor</label><input id="auditor" placeholder="Your name"><button style="margin-top:14px" id="start" '+(!state.stores.length?'disabled':'')+'>Start new audit</button></div><div class="card"><h2>Previous audits</h2>'+(state.audits.length?state.audits.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(a=>'<div class="item"><div><b>'+esc(storeName(a.storeId))+'</b><div class="muted">'+esc(a.date)+' · '+esc(a.status||"Draft")+'</div></div><button class="secondary" data-open="'+esc(a.id)+'">Open</button></div>').join(""):'<p>No audits yet.</p>')+'</div><div class="card noprint"><h2>Data & backup</h2><p>Audits and photos are stored in this browser on this device, not in GitHub or the cloud. Clearing browser data may erase them.</p><div class="row"><button class="secondary" id="export">Export backup</button><button class="secondary" id="importBtn">Import backup</button></div><input class="hide" type="file" accept="application/json" id="importFile"></div>';
document.getElementById("addStore").onclick=()=>{const name=document.getElementById("storeName").value.trim();if(!name)return alert("Enter a store name.");state.stores.push({id:uid(),name,address:document.getElementById("storeAddress").value.trim()});save();render()};
document.getElementById("start").onclick=()=>{const storeId=document.getElementById("storeSelect").value;if(!storeId)return alert("Choose a store.");const a={id:uid(),storeId,date:document.getElementById("visitDate").value||new Date().toISOString().slice(0,10),auditor:document.getElementById("auditor").value.trim(),status:"Draft",sections:CATS.map(name=>({name,notes:"",photos:[]}))};state.audits.push(a);active=a.id;page="edit";save();render()};
document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{active=b.dataset.open;page="edit";render()});
document.getElementById("export").onclick=()=>download("atomic-backup-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(state,null,2),"application/json");
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data.stores)||!Array.isArray(data.audits))throw Error();if(confirm("Replace all locally saved stores and audits with this backup?")){state=data;save();render()}}catch(e){alert("Invalid backup file.")}}}
function audit(){return state.audits.find(a=>a.id===active)}
function edit(){const a=audit();if(!a){page="home";return render()}el.innerHTML='<button class="secondary back noprint" id="back">← All visits</button><h1>'+esc(storeName(a.storeId))+'</h1><p>'+esc(a.date)+' · '+esc(a.status)+' · Changes save automatically</p><div class="card"><div class="row"><button class="secondary" id="view">Preview / print PDF</button><button id="complete">'+(a.status==="Complete"?"Reopen draft":"Mark complete")+'</button></div></div>'+a.sections.map((s,i)=>'<section class="card"><h2><span class="pill">'+String(i+1).padStart(2,"0")+'</span> '+esc(s.name)+'</h2><label>Visit notes</label><textarea data-note="'+i+'" placeholder="Condition, merchandising, opportunities, follow-up...">'+esc(s.notes)+'</textarea><label>Photos (camera or library)</label><input type="file" accept="image/*" capture="environment" multiple data-photo="'+i+'"><div class="photos">'+s.photos.map((p,j)=>'<div class="photo"><img src="'+esc(p)+'"><button data-remove="'+i+':'+j+'" aria-label="Remove photo">×</button></div>').join("")+'</div></section>').join("")+'<div class="row noprint"><button class="secondary" id="delete">Delete audit</button><button id="bottomReport">View report</button></div>';
document.getElementById("back").onclick=()=>{page="home";render()};
document.getElementById("view").onclick=document.getElementById("bottomReport").onclick=()=>{page="report";render()};
document.getElementById("complete").onclick=()=>{a.status=a.status==="Complete"?"Draft":"Complete";save();render()};
document.getElementById("delete").onclick=()=>{if(confirm("Permanently delete this audit?")){state.audits=state.audits.filter(x=>x.id!==active);save();page="home";render()}};
document.querySelectorAll("[data-note]").forEach(t=>t.oninput=()=>{a.sections[+t.dataset.note].notes=t.value;save()});
document.querySelectorAll("[data-photo]").forEach(t=>t.onchange=async()=>{const idx=+t.dataset.photo;for(const f of Array.from(t.files)){try{const data=await compress(f);a.sections[idx].photos.push(data)}catch(e){alert("Could not add photo.")}}save();render()});
document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{const [i,j]=b.dataset.remove.split(":").map(Number);a.sections[i].photos.splice(j,1);save();render()})}
function compress(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const scale=Math.min(1,1200/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL("image/jpeg",.72))};img.onerror=()=>{URL.revokeObjectURL(url);reject()};img.src=url})}
function report(){const a=audit();el.innerHTML='<div class="noprint row"><button class="secondary" id="return">← Back to audit</button><button id="print">Print / save PDF</button></div><h1 style="margin-top:22px">PRODUCE DEPARTMENT AUDIT</h1><p><b>'+esc(storeName(a.storeId))+'</b><br>'+esc(state.stores.find(s=>s.id===a.storeId)?.address||"")+'<br>Visit: '+esc(a.date)+' · Auditor: '+esc(a.auditor||"Not specified")+' · '+esc(a.status)+'</p>'+a.sections.map((s,i)=>'<section class="card"><h2>'+String(i+1).padStart(2,"0")+' / '+esc(s.name)+'</h2><p style="white-space:pre-wrap">'+esc(s.notes||"No notes recorded.")+'</p><div class="photos">'+s.photos.map(p=>'<img style="width:170px;height:170px;object-fit:cover;border-radius:8px" src="'+esc(p)+'">').join("")+'</div></section>').join("");document.getElementById("return").onclick=()=>{page="edit";render()};document.getElementById("print").onclick=()=>window.print()}
function download(name,data,type){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
render();
</script></body></html>
